# Kind Cluster Configuration — Multi-Node SRE Platform Cluster
# Provides 1 control-plane and 2 worker nodes to ensure capacity for 1000-user scaling ramp and HPA demos.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ecom-sre-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
      - containerPort: 30003
        hostPort: 30003
        protocol: TCP
      - containerPort: 30004
        hostPort: 30004
        protocol: TCP
  - role: worker
    labels:
      tier: app
  - role: worker
    labels:
      tier: app
