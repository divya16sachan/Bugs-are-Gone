apiVersion: v1
kind: Service
metadata:
  name: ecom-postgres
  namespace: ecom
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-redis
  namespace: ecom
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-rabbitmq
  namespace: ecom
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
    - port: 5672
      targetPort: 5672
