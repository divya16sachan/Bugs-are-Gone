apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ecom-monitoring-alerts
  namespace: monitoring
  labels:
    release: prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: ecom-service-alerts
      rules:
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} error rate above 5%"
            description: "Service {{ $labels.service }} has a 5xx error rate greater than 5% over the last 5 minutes."
            runbook_url: "https://github.com/divya16sachan/Bugs-are-Gone/blob/main/monitoring/runbooks/high-error-rate.md"

        - alert: HighLatency
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le)) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} p95 latency above 1s"
            description: "Service {{ $labels.service }} 95th percentile latency is exceeding 1 second."
            runbook_url: "https://github.com/divya16sachan/Bugs-are-Gone/blob/main/monitoring/runbooks/high-latency.md"

        - alert: ServiceDown
          expr: up{job=~".*-service"} == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} is down"
            description: "Service instance {{ $labels.instance }} (job: {{ $labels.job }}) has been unreachable for more than 30 seconds."
            runbook_url: "https://github.com/divya16sachan/Bugs-are-Gone/blob/main/monitoring/runbooks/service-down.md"

        - alert: QueueBacklog
          expr: rabbitmq_detailed_queue_messages > 100
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Queue {{ $labels.queue }} backlog above 100 messages"
            description: "RabbitMQ queue {{ $labels.queue }} depth is currently {{ $value }}, exceeding the 100 message threshold."
            runbook_url: "https://github.com/divya16sachan/Bugs-are-Gone/blob/main/monitoring/runbooks/queue-backlog.md"

        - alert: PodCrashLooping
          expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} (namespace: {{ $labels.namespace }}, container: {{ $labels.container }}) has entered CrashLoopBackOff state."
            runbook_url: "https://github.com/divya16sachan/Bugs-are-Gone/blob/main/monitoring/runbooks/pod-crash-looping.md"
