global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Placeholder for alert rules in Phase 2
rule_files:
  - "/etc/prometheus/rules/alerts.yml"
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rabbitmq"
    scrape_interval: 15s
    scrape_timeout: 12s
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "rabbitmq-queues"
    scrape_interval: 15s
    scrape_timeout: 12s
    metrics_path: "/metrics/detailed"
    params:
      family: ["queue_coarse_metrics"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "user-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: "user-service"

  - job_name: "catalog-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3002"]
        labels:
          service: "catalog-service"

  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3003"]
        labels:
          service: "order-service"

  - job_name: "payment-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3004"]
        labels:
          service: "payment-service"

  # Optional: Enable when running Kubernetes cluster with kube-state-metrics port-forwarded:
  # kubectl port-forward -n kube-system svc/kube-state-metrics 8088:8080
  # - job_name: "kube-state-metrics"
  #   scrape_interval: 5s
  #   static_configs:
  #     - targets: ["host.docker.internal:8088"]

