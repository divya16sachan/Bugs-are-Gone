groups:
  - name: ecom-alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[1m])) by (service) / sum(rate(http_requests_total[1m])) by (service) > 0.05
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} error rate above 5%"
          description: "Service {{ $labels.service }} has a 5xx error rate greater than 5%."

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (service, le)) > 1
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p95 latency above 1s"
          description: "Service {{ $labels.service }} 95th percentile latency is exceeding 1 second."

      - alert: ServiceDown
        expr: up{job=~".*-service"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Service instance {{ $labels.instance }} (job: {{ $labels.job }}) has been unreachable for more than 15 seconds."

      - alert: QueueBacklog
        expr: (sum(rabbitmq_detailed_queue_messages) by (queue) or sum(rabbitmq_queue_messages) by (queue)) > 30
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} backlog above 30 messages"
          description: "RabbitMQ queue {{ $labels.queue }} depth is currently {{ $value }}, exceeding the 30 message threshold."

      - alert: PodCrashLooping
        expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.pod }} (namespace: {{ $labels.namespace }}, container: {{ $labels.container }}) has entered CrashLoopBackOff state."

